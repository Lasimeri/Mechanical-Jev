# Mechanical Jev defaults. Every key is also an environment variable, and
# anything already in the environment wins. Keep your key out of this file:
# put it in mjev.local.conf (not tracked) or ~/.config/mechanical-jev/mjev.conf.
#   TYPESAFE_API_KEY=...        (create one at console.typesafe.ai)

# The API root and the model (the official SDKs read the same variables).
TYPESAFE_BASE_URL=https://api.typesafe.ai
TYPESAFE_DEFAULT_MODEL=jev-latest
