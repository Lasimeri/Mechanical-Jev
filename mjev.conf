# Mechanical Jev defaults. Every key is also an environment variable, and
# anything already in the environment wins; a machine's own values go in
# mjev.local.conf (not tracked) or ~/.config/mechanical-jev/mjev.conf.

# The System One server: Intel Phi Jev (github.com/Lasimeri/Intel-Phi-Jev)
# on this machine. It needs no key.
TYPESAFE_BASE_URL=http://127.0.0.1:8090
TYPESAFE_DEFAULT_MODEL=jev-latest

# Whether mjev starts the server when it is down (1) or reports it (0).
# The server's subject and site come from Intel Phi Jev's xks.conf. Its
# binary is found without a key: xks on PATH, else target/release/xks in a
# checkout next to this one, or in $HOME, named Intel-Phi-Jev or
# "Intel Phi Jev" (src/phi.md). Set MJEV_XKS only for one somewhere else:
#   MJEV_XKS="/path/to/xks"
MJEV_AUTOSTART=1
