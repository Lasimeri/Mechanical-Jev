[package]
name = "jevre"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Reverse engineering Jev from its published documentation: fits of the published token counts and probabilities (offline)"
publish = false

[dependencies]
tokenizers = { version = "=0.23.1", default-features = false, features = ["onig"] }
serde_json = "1"

[profile.release]
opt-level = 3
